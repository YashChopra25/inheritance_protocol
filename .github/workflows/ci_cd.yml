name: vault-inheritance CI/CD

# Fixes M3/M4: the previous pipeline ran no tests, no lint and no typecheck, and
# deployed from a feature branch straight to a self-hosted box with guaranteed
# downtime and no rollback.
#
# Now every push and PR is verified, and only `main` deploys — and only after
# the full verification job passes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer commit supersedes an in-flight run on the same ref, except on main
  # where a half-finished deploy must not be cancelled.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  program:
    name: Anchor program — build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 1.1.2
          avm use 1.1.2

      # The LiteSVM suite loads target/deploy/vault_inheritance.so, so the SBF
      # artifact has to exist before the tests run.
      - name: Build program
        run: anchor build

      - name: Test program
        run: cargo test --workspace

      - name: Upload program artifacts
        uses: actions/upload-artifact@v4
        with:
          name: program-build
          path: |
            target/deploy/vault_inheritance.so
            target/idl/vault_inheritance.json
          retention-days: 14

  app:
    name: Next.js app — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `npm ci` (not `npm install`): installs exactly the lockfile, so CI can
      # never silently build against a different dependency tree than review saw.
      - name: Install dependencies
        run: npm ci

      # Fails on any UNREVIEWED high/critical advisory. Known-unreachable ones
      # carry a written justification and a review date in the script itself,
      # so the gate stays meaningful instead of permanently red.
      - name: Audit production dependencies
        run: npm run audit

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          # Build-time public config. Real secrets are not needed to compile.
          NEXT_PUBLIC_PROGRAM_ID: ${{ secrets.NEXT_PUBLIC_PROGRAM_ID }}
          NEXT_PUBLIC_SOLANA_CLUSTER: ${{ secrets.NEXT_PUBLIC_SOLANA_CLUSTER }}
          NEXT_PUBLIC_RPC_ENDPOINT: ${{ secrets.NEXT_PUBLIC_RPC_ENDPOINT }}
          NEXT_PUBLIC_PINATA_GATEWAY: ${{ secrets.NEXT_PUBLIC_PINATA_GATEWAY }}
        run: npm run build

  deploy:
    name: Deploy
    # Only after BOTH verification jobs pass, and only from main.
    needs: [program, app]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    environment: production
    defaults:
      run:
        working-directory: ./app
    steps:
      # `clean: false` is load-bearing. The default (`git clean -ffdx`) deletes
      # every ignored file in the workspace — including the `.next` build and
      # `.env` that the live PM2 process is serving from — before anything else
      # runs, which both broke the running site mid-deploy and left nothing to
      # roll back to. Tracked files are still force-checked-out to the commit.
      - uses: actions/checkout@v4
        with:
          clean: false

      # Snapshot what is serving right now so a failed build or health check
      # can put it back. Copied (not moved): the live server lazily reads chunks
      # from `.next` and must keep working while the new build runs.
      #
      # Best effort by nature: `npm ci` below still replaces node_modules, so a
      # rollback runs the previous build against the new dependency tree. That
      # is the right trade for a lockfile-pinned tree; anything subtler needs
      # release directories (build into a fresh dir, then flip a symlink).
      - name: Preserve current build
        id: preserve
        run: |
          set -euo pipefail
          rm -rf .next.prev .env.prev
          if [ -d .next ]; then
            cp -a .next .next.prev
            if [ -f .env ]; then cp -a .env .env.prev; fi
            echo "has_prev=true" >> "$GITHUB_OUTPUT"
          else
            echo "No existing build; nothing to roll back to on failure."
            echo "has_prev=false" >> "$GITHUB_OUTPUT"
          fi

      # Written fresh with `>` rather than appended with `>>`: the previous
      # pipeline appended on a persistent self-hosted runner, so the file grew
      # duplicate keys on every single deploy.
      - name: Write .env
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PINATA_JWT_TOKEN: ${{ secrets.PINATA_JWT_TOKEN }}
          PINATA_GATEWAY: ${{ secrets.PINATA_GATEWAY }}
          NEXT_PUBLIC_PINATA_GATEWAY: ${{ secrets.NEXT_PUBLIC_PINATA_GATEWAY }}
          NEXT_PUBLIC_SOLANA_CLUSTER: ${{ secrets.NEXT_PUBLIC_SOLANA_CLUSTER }}
          NEXT_PUBLIC_RPC_ENDPOINT: ${{ secrets.NEXT_PUBLIC_RPC_ENDPOINT }}
          NEXT_PUBLIC_PROGRAM_ID: ${{ secrets.NEXT_PUBLIC_PROGRAM_ID }}
          # Optional. Each is written only when configured, so an unset secret
          # leaves the app on its documented default instead of an empty value.
          APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          set -euo pipefail
          : "${SESSION_SECRET:?SESSION_SECRET must be configured}"
          : "${NEXT_PUBLIC_PROGRAM_ID:?NEXT_PUBLIC_PROGRAM_ID must be configured}"
          umask 077
          {
            echo "SESSION_SECRET=${SESSION_SECRET}"
            echo "PINATA_JWT_TOKEN=${PINATA_JWT_TOKEN}"
            echo "PINATA_GATEWAY=${PINATA_GATEWAY}"
            echo "NEXT_PUBLIC_PINATA_GATEWAY=${NEXT_PUBLIC_PINATA_GATEWAY}"
            echo "NEXT_PUBLIC_SOLANA_CLUSTER=${NEXT_PUBLIC_SOLANA_CLUSTER}"
            echo "NEXT_PUBLIC_RPC_ENDPOINT=${NEXT_PUBLIC_RPC_ENDPOINT}"
            echo "NEXT_PUBLIC_PROGRAM_ID=${NEXT_PUBLIC_PROGRAM_ID}"
            for name in APP_ORIGIN SOLANA_RPC_URL UPSTASH_REDIS_REST_URL UPSTASH_REDIS_REST_TOKEN; do
              if [ -n "${!name:-}" ]; then echo "${name}=${!name}"; fi
            done
          } > .env

      - name: Install and build
        run: |
          npm ci
          npm run build

      # `pm2 reload` performs a rolling restart instead of the previous
      # delete-then-start, which dropped every request in between.
      - name: Reload app
        run: pm2 reload vault-inheritance --update-env || pm2 start npm --name vault-inheritance -- run start

      - name: Health check
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 http://127.0.0.1:3001/ > /dev/null; then
              echo "healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::App did not become healthy"
          exit 1

      # Runs when ANY step after the snapshot failed — a broken build leaves a
      # half-written `.next` under the live process just as surely as a bad
      # release fails its health check. Restores the previous build and env,
      # reloads PM2 onto them, and the job still ends red.
      - name: Roll back to previous build
        if: failure() && steps.preserve.outputs.has_prev == 'true'
        run: |
          set -euo pipefail
          echo "::warning::Deploy failed; restoring the previous build"
          rm -rf .next
          mv .next.prev .next
          if [ -f .env.prev ]; then mv .env.prev .env; fi
          pm2 reload vault-inheritance --update-env
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 http://127.0.0.1:3001/ > /dev/null; then
              echo "previous build is serving again after ${i} attempt(s)"
              exit 1
            fi
            sleep 3
          done
          echo "::error::Rollback did not become healthy either; manual intervention needed"
          exit 1
